# Experiment 2A: all-credit LR tuning, a 500-update prefix of the main schedule.
prior_file: Exp2_PD.yaml
experiment: exp2pilots_pd
design: cpt_pilot
sweep:
  arm: [tabicl, tabpfn3]
  lr_index: [0, 1]
  prior.credit_fraction: [0.0, 0.5]
  seeds: [990]
train:
  max_steps: 500
  keep_steps: [500]
  save_perm_every: 500
progress:
  every_datasets: 0
  n_ood: 0
eval:
  selection_scope: all_credit
  include_reference_slots: false
  include_ood: false
