# =============================================================================
# LGD EXPERIMENT — everything about it is in this one file.
#
# Loss Given Default: regression on a target that lives in [0,1] and often has
# a lump of mass sitting exactly on 0 (full recovery) or exactly on 1 (total
# loss). Head: 999-quantile pinball, same as TabICLv2's regressor.
#
# -----------------------------------------------------------------------------
# HOW THE SWEEP WORKS
# -----------------------------------------------------------------------------
# Any setting below can be a single value or a list.
#   single value -> used as is
#   list         -> one run per value, and all lists are combined
#
# So 3 settings with 2 values each = 8 runs, times the number of seeds.
# ALWAYS check the count before submitting:
#
#     python scripts/pretrain.py --config config/LGD.yaml --list
#
# Settings whose name ends in `_range` are a literal [low, high] interval that
# gets sampled from. They are NOT swept. To sweep one, nest it:
#     boundary_mass_range: [[0.0, 0.1], [0.1, 0.3]]
#
# Settings left at one value carry a `# sweep: [...]` comment showing how to
# open them up. Open ONE GROUP AT A TIME, or you will not be able to tell which
# change caused which effect.
# =============================================================================

experiment: lgd
task: lgd
seeds: [0, 1, 2] # combined outermost, so a cut-short array still covers the grid

# -----------------------------------------------------------------------------
# 1. THE PRIOR — which synthetic datasets the model pretrains on
# -----------------------------------------------------------------------------
prior:
  # ===========================================================================
  # THE MAIN SWITCH: how much of the pretraining data is OURS.
  # The rest comes from the original TabICL prior, completely unchanged.
  #
  #   0.0 -> 100% original  (the control run — nothing of ours at all)
  #   0.1 ->  90% original
  #   0.2 ->  80% original
  #   0.3 ->  70% original
  #
  # Staying at 70-90% original keeps the model generally capable and is the
  # natural defence against the collapse Tanna 2026 reports when TabICL is
  # adapted too aggressively.
  # ===========================================================================
  credit_fraction: [0.0, 0.1, 0.2, 0.3]

  # Dataset size and shape. These are O'Prior's numbers, so our results stay
  # comparable to theirs: 512-1024 rows, 3-50 features.
  n_rows_range: [512, 1024]
  n_features_range: [3, 50]
  max_features: 64 # headroom above n_features_range for extra columns
  n_nodes_range: [2, 33] # size of the random causal graph
  train_frac_range: [0.3, 0.9] # TabICLv2 stage 1 uses 30-90% as context
  max_filter_attempts: 40

  # --- the ORIGINAL TabICL prior (used for the 1 - credit_fraction share) ----
  # Leave these alone unless you mean to change the control arm itself.
  base:
    max_cat_size: 100 # upstream cap on categorical cardinality
    category_frequency: balanced # upstream nearest-centre / softmax assignment

  # --- OUR new datasets ------------------------------------------------------
  credit:
    max_cat_size: 100
    category_frequency: balanced # LGD features are less cardinality-driven than PD

    target:
      # How the atoms at 0 and 1 get made.
      #   quantile: mass at each end is set exactly. Best for a controlled test.
      #   censor  : build a latent loss fraction on a wider range, then clip to
      #             [0,1]. The true economic story — a recovery can exceed the
      #             loan, and workout costs can too — with emergent mass.
      mode: quantile # sweep: [quantile, censor]

      # Interior shape, via a Kumaraswamy curve. Both parameters are drawn
      # log-uniformly from this range, which covers every shape we measured:
      #   a<1,b<1 -> U-shaped        (Freddie)
      #   a>1,b>1 -> humped middle   (AXA)
      #   a>1,b<1 -> leans toward 1  (LendingClub)
      #   a<1,b>1 -> leans toward 0
      shape_ab_range: [0.3, 4.0]

      # How much mass sits on a boundary when that atom exists.
      # Measured in our own files: Freddie 11.4% / 8.1%, LendingClub 1.5% / 0.3%,
      # AXA 0% / 0%. The three disagree, so this has to be a range and not one
      # fixed number, or we would just be fitting Freddie.
      boundary_mass_range: [0.02, 0.25]

      # Chance each atom exists at all. 0.75 leaves real weight on one-sided and
      # interior-only shapes. Set to 1.0 to force EVERY dataset to have mass on
      # both 0 and 1.
      atom_prob: [0.75, 1.0]

      # Always keep some mass in the middle, or the target degenerates into two
      # points and the degeneracy check throws it away.
      max_total_boundary_mass: 0.60

      # Weakens the link between features and target, applied BEFORE ranking so
      # target SHAPE and target DIFFICULTY move independently. 1.0 = no
      # weakening. Published LGD R-squared is about 0.04-0.43, so lower values
      # are the realistic case, not a handicap.
      signal_strength: 1.0 # sweep: [1.0, 0.5]

      # Real LGD comes from currency amounts and is often stored rounded, which
      # clusters values on a grid. 0 turns this off.
      round_to: 0
      round_prob: 0.25

      # none    -> the model sees y on [0,1], the real scale
      # standard-> apply the original prior's outlier clip + standardisation.
      #            That map is a straight line, so it keeps the shape and only
      #            destroys the [0,1] range. Keeping this separate from the shape
      #            settings is what lets us tell the two apart.
      #
      # Either way the target is hard-clipped to [0,1] first, on every dataset.
      # LGD is a fraction and cannot leave [0,1]; nothing in the original prior
      # knows that, and encoding just this one fact is the cheapest useful thing
      # in the whole module.
      target_scaling: [none, standard]

    # --- columns that carry no information ----------------------------------
    # Real credit files are full of useless columns: operational fields, near
    # duplicates, dead codes. The original prior only makes these by accident of
    # random graph shape, and its graph filter actively removes the fully
    # disconnected case. So we add them on purpose.
    #
    # `shuffled` is the interesting one: same distribution as a real column, no
    # relationship to the target at all. Column statistics cannot spot it — only
    # the relationship to y can.
    noise_features:
      fraction: 0.3 # sweep: [0.0, 0.3, 0.6] — relative to current width
      kind_weights:
        pure_noise: 1.0
        duplicate: 1.0
        shuffled: 1.0
        constant: 0.5

  # --- which datasets get thrown away ---------------------------------------
  # tabicl: as shipped. Drops any dataset a shallow ExtraTrees cannot beat a
  #         constant on. Removes about 25% of stage-1 regression datasets, and
  #         the TabICLv2 paper shows it IMPROVES training. So `banded` has to
  #         beat that, not just ignore it.
  # off   : keep everything.
  # banded: keep only datasets whose difficulty lands in `quantile_band`, i.e.
  #         deliberately aim at credit's low-signal range instead of merely
  #         allowing it. This is a removal, not an addition, so nobody can
  #         accuse it of adding model capacity.
  filter:
    mode: tabicl # sweep: [tabicl, off, banded]
    quantile_band: [0.02, 0.45] # published LGD R-squared range
    remove_trivial: false
    trivial_threshold: 0.1

# -----------------------------------------------------------------------------
# 2. HOW TO START — from nothing, or from existing weights
# -----------------------------------------------------------------------------
# All four options come from what TabICL itself does. Full reasoning in
# docs/finetuning.md.
#
#   scratch   train every weight from random init. Cleanest comparison, and the
#             DEFAULT. Use this first.
#   full      load pretrained weights, train everything at a low learning rate.
#             This is TabICL v2's own final stage: lr 2e-5, cosine, clip 1.0.
#   icl_only  freeze the column and row blocks, train the ICL stack plus both
#             target embeddings and the head. TabICL v1's final stage:
#             lr 2e-6, constant schedule, clip 1.0.
#   head_only freeze all three block stacks. A floor to compare against, not a
#             serious candidate.
#
# Why `icl_only` and not some other split: our change is to the TARGET. The
# column and row stages describe the table; the ICL stack is where the target
# relationship lives. Freezing the first two keeps the general table
# understanding while letting the target side move. The target embeddings stay
# trainable even inside a frozen stack — a plain freeze would lock them and
# defeat the whole point.
#
# NO LoRA. There is none in TabICL anywhere, and Tanna 2025 found it unstable on
# TabPFN. Adding it would be a third thing changing at once.
#
# WARNING before using anything but `scratch`: whether the released TabICLv2
# checkpoints load into NanoTabICL is UNTESTED — the module names differ.
# src/train/adapt.py refuses to run rather than quietly training a random model,
# so try it and read the error. The clean route is to pretrain your own base
# with `scratch`, then fine-tune from that.
init:
  strategy: scratch # sweep: [scratch, full, icl_only]
  pretrained_path: null # required for anything except `scratch`

# -----------------------------------------------------------------------------
# 3. THE MODEL — held FIXED across every run
# -----------------------------------------------------------------------------
# This is the whole point of the experiment: architecture, optimizer and compute
# budget stay identical, and only the prior changes. Do not sweep these.
model:
  embed_dim: 128
  col_num_blocks: 3
  row_num_blocks: 3
  icl_num_blocks: 12
  col_nhead: 8
  row_nhead: 8
  icl_nhead: 8
  feature_group_size: 3
  n_cls_cols: 4
  n_cls_rows: 128

# -----------------------------------------------------------------------------
# 4. TRAINING
# -----------------------------------------------------------------------------
train:
  # O'Prior's budget: 40,000 datasets per prior = 10,000 steps x 4 per step.
  # "Matched compute" here means STEPS AND DATASETS, never wall-clock or credits
  # — turning the filter off makes dataset generation cheaper, so time is not
  # comparable between filter settings.
  max_steps: 10000
  batch_size: 4
  micro_batch_size: 4
  num_quantiles: 999 # TabICLv2's regressor head

  optimizer: adamw # NOT Muon — see src/train/optim.py for why
  scheduler: cosine_with_restarts # or `constant`, which v1's final stage used
  lr: 3.0e-4
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  gradient_clipping: 10.0 # TabICLv2 stage 1; drop to 1.0 when fine-tuning
  warmup_proportion: 0.01
  cosine_num_cycles: 1
  cosine_amplitude_decay: 1.0
  cosine_lr_end: 1.0e-7

  amp: true
  num_workers: 12 # dataset generation is CPU-bound; see docs/vsc.md
  log_every: 50
  save_temp_every: 500
  save_perm_every: 5000
  max_temp_checkpoints: 2

# -----------------------------------------------------------------------------
# 5. LOGGING
# -----------------------------------------------------------------------------
logging:
  level: INFO # DEBUG for much more detail
  console: true
  # Every run writes logs/<run name>_<timestamp>.log plus a machine-readable
  # metrics.jsonl. See src/utils/logging_setup.py.
  log_prior_every: 500 # how often to log what the prior is actually producing
  log_prior_samples: 16 # how many datasets to inspect for that report

# -----------------------------------------------------------------------------
# 6. EVALUATION — which real datasets this experiment is scored on
# -----------------------------------------------------------------------------
# NOT YET WIRED UP. Recorded here so the choice is written down and version
# controlled rather than decided ad hoc later.
#
# The dev/holdout split must be FROZEN before any prior tuning happens, or we
# meta-overfit exactly the way Mitra warns about. This needs Andreas's sign-off
# — it is a scientific commitment, not a coding choice.
eval:
  data_dir: data/raw/lgd
  dev_datasets: [] # TODO: decide and freeze
  holdout_datasets: [] # TODO: never look at these until the end
  metrics: [pinball, crps, coverage, boundary_mass_calibration, r2, rmse]
  # For a two-humped target the median and mean both land in the empty middle,
  # so a single-number prediction is misleading. State the decoding rule.
  point_prediction: median # or `mean`
  clip_predictions_to_unit: true
