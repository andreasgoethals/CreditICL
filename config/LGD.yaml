# =============================================================================
# LGD EXPERIMENT — Loss Given Default. Bounded [0,1] regression with mass on the
# boundaries. Head: 999-quantile pinball, as in TabICLv2's regressor.
#
# HOW TO READ THIS FILE
#   * any setting may be a single value OR a list; a list means "one run per
#     value", and all lists are crossed
#   * `# S:` marks a setting left at one value, showing how to open it up
#   * names ending in `_range` are literal [low, high] intervals, never swept
#
#   python scripts/pretrain.py --config config/LGD.yaml --list   # check the count
#
# WHY each setting exists, and what the evidence for it is:
#   -> docs/config_reference.md
# =============================================================================

experiment: lgd
task: lgd
seeds: [0, 1, 2]

# -----------------------------------------------------------------------------
# PRIOR
# -----------------------------------------------------------------------------
prior:
  # THE MAIN SWITCH — share of pretraining datasets from OUR path.
  # 0.0 = 100% original prior (control) | 0.3 = 70% original
  credit_fraction: [0.0, 0.1, 0.2, 0.3]

  # Episode geometry (O'Prior's numbers, so results stay comparable)
  n_rows_range: [512, 1024]
  n_features_range: [3, 50]
  max_features: 64
  n_nodes_range: [2, 33] # size of the random causal graph
  train_frac_range: [0.3, 0.9] # share used as in-context examples
  max_filter_attempts: 40

  # Where the training datasets come from.
  #   generate = build them live (simple; the GPU waits on CPU generation)
  #   pool     = read pre-generated shards (PREFERRED for the real experiment:
  #              every arm draws its original share from the SAME files, so a
  #              difference between arms cannot be luck of the draw)
  # Build the pools first with scripts/generate_prior.py.
  pool:
    source: generate # S: [generate, pool]
    original_variant: original
    credit_variant: credit_v1

  # TabICL's correlated sampling: datasets in a group share shape and difficulty.
  grouping:
    group_size: 4 # S: [1, 4]   — 1 disables grouping
    subgroup_size: 2

  # The ORIGINAL TabICL prior. Changing these changes the control arm.
  base:
    max_cat_size: 100
    category_frequency: balanced

  # OUR credit-targeted path.
  credit:
    max_cat_size: 100
    category_frequency: balanced

    target:
      # How the target is produced.
      #   quantile  — exact boundary masses from a Kumaraswamy mixture (best for
      #               clean ablation: you dial the atoms in and get them exactly)
      #   censor    — clip a wider latent; atoms emerge from the clipping
      #   mechanism — derive LGD from credit ECONOMICS: collateral coverage,
      #               workout cashflows, portfolio segments. Atoms emerge from
      #               over-collateralisation and total loss. This is the arm
      #               O'Prior's "mechanism diversity" finding points at, and it
      #               spans all 7 real datasets' boundary mass (1.8%–73%).
      mode: mechanism # S: [mechanism, quantile, censor]

      # Only read when mode: mechanism. See src/prior/targets/mechanisms.py.
      mechanism:
        mechanism_weights: { collateral: 0.4, workout: 0.35, segment_mixture: 0.25 }
        cohort: { min_cohorts: 1, max_cohorts: 12 } # vintage-level systematic shocks
      shape_ab_range: [0.3, 4.0] # Kumaraswamy shape; spans U / humped / skewed
      boundary_mass_range: [0.02, 0.25] # mass per atom when present
      # Share of datasets that carry boundary atoms AT ALL. Never 1.0:
      # lgd_lendingclub has only 1.8% boundary mass — effectively interior —
      # so a prior where EVERY dataset has atoms cannot represent it.
      # Read by BOTH the mechanism and quantile paths.
      atom_prob: [0.6, 0.8]
      max_total_boundary_mass: 0.60 # keep real mass in the middle
      signal_strength: 1.0 # S: [1.0, 0.5]   — 1.0 = undiluted
      round_to: 0 # recording granularity; 0 = off
      round_prob: 0.25
      target_scaling: [none, standard] # none = model sees [0,1]

    # Columns carrying no information. `shuffled` is the interesting kind.
    noise_features:
      fraction: 0.3 # S: [0.0, 0.3, 0.6]   — relative to current width
      kind_weights: { pure_noise: 1.0, duplicate: 1.0, shuffled: 1.0, constant: 0.5 }

  # Which generated datasets get discarded.
  # tabicl = as shipped | off = keep all | banded = target credit's signal range
  filter:
    mode: tabicl # S: [tabicl, off, banded]
    quantile_band: [0.02, 0.45] # used by `banded` only
    remove_trivial: false
    trivial_threshold: 0.1

# -----------------------------------------------------------------------------
# HOW TO START
# scratch = random init | full = pretrained, train all | icl_only = freeze col+row
# head_only = freeze all blocks.  Details: docs/finetuning.md
# -----------------------------------------------------------------------------
init:
  strategy: scratch # S: [scratch, full, icl_only]
  pretrained_path: null # required unless `scratch`

# -----------------------------------------------------------------------------
# MODEL — held FIXED across every run. Do not sweep.
# -----------------------------------------------------------------------------
model:
  embed_dim: 128
  col_num_blocks: 3
  row_num_blocks: 3
  icl_num_blocks: 12
  col_nhead: 8
  row_nhead: 8
  icl_nhead: 8
  feature_group_size: 3
  n_cls_cols: 4
  n_cls_rows: 128

# -----------------------------------------------------------------------------
# TRAINING — 100,000 steps x 4 datasets = 400,000 datasets, ONE pass each.
#
# O'PRIOR (arXiv 2605.18971) used 40,000 datasets at batch 4 over 10,000 steps. Note
# 10,000 x 4 = 40,000 exactly: each of their datasets is seen ONCE, and their
# "10 epochs of 1,000 steps" is step bookkeeping, not ten passes.
#
# We use 10x that, still one pass each. More UNIQUE datasets beats re-showing the same
# ones: it lowers the sampling noise in what the prior actually is, and removes any
# chance of the model memorising individual synthetic tables. Generation is CPU-bound
# and we parallelise it 20 ways on cheap nodes, so the extra data is nearly free — the
# cost is GPU steps, which is why this is a deliberate budget decision and not a
# default. Every arm gets exactly this budget; that is what "matched compute" means.
# "Matched compute" means steps and datasets, never wall-clock.
# -----------------------------------------------------------------------------
train:
  max_steps: 100000
  batch_size: 4
  micro_batch_size: 4
  num_quantiles: 999

  # Muon is what TabICLv2 uses, and it credits part of its gain to it.
  # torch >= 2.9 ships torch.optim.Muon, so this needs no extra dependency.
  # Muon handles only the 2-D weight matrices; biases/LayerNorm/embeddings get AdamW
  # alongside it (see src/train/optim.py) — that pairing is part of the method.
  # Held FIXED across arms either way, so it is not the experimental variable.
  optimizer: muon # S: [muon, adamw]
  scheduler: cosine_with_restarts # or `constant` for a frozen fine-tune
  lr: 3.0e-4 # AdamW rate, and the rate for Muon's auxiliary AdamW half
  muon_lr: 8.0e-4 # TabICLv2's stage-1 rate; Muon prefers ~8x AdamW's
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  gradient_clipping: 10.0 # drop to 1.0 when fine-tuning
  warmup_proportion: 0.01
  cosine_num_cycles: 1
  cosine_amplitude_decay: 1.0
  cosine_lr_end: 1.0e-7

  amp: true
  num_workers: 12 # dataset generation is CPU-bound
  log_every: 250
  save_temp_every: 2000
  save_perm_every: 25000
  max_temp_checkpoints: 2

# -----------------------------------------------------------------------------
# LOGGING — files are written on the cluster only, never locally.
# -----------------------------------------------------------------------------
logging:
  level: INFO
  console: true
  to_file: null # null = write files on the cluster only; true/false to force
  log_prior_every: 500 # steps between prior-output reports; 0 = off
  log_prior_samples: 16

# -----------------------------------------------------------------------------
# EVALUATION — NOT YET WIRED UP.
# The dev/holdout split must be frozen BEFORE any prior tuning, or we
# meta-overfit. Needs sign-off; see docs/experimental_design.md §5.6.
# -----------------------------------------------------------------------------
eval:
  data_dir: data/raw/lgd
  dev_datasets: [] # TODO decide and freeze
  holdout_datasets: [] # TODO never inspect until the end
  metrics: [pinball, crps, coverage, boundary_mass_calibration, r2, rmse]
  point_prediction: median # or mean; changes the number materially
  clip_predictions_to_unit: true
