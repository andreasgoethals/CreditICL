# =============================================================================
# EXPERIMENT 1 — PD — WHICH PRIOR? (screening, MANY priors)
#
# Probability of Default — imbalanced binary classification. Head: binary classification.
#
# THIS EXPERIMENT HAS 25 DIFFERENT PRIORS, not one. That is the whole design: each
# arm below is a distinct synthetic task distribution, and the question is which of
# them produces the best model on real credit data. Architecture, optimizer and
# budget are held fixed so the prior is the only thing that varies.
#
# NOT the headline result. An 800,000-dataset model is 2.5 % of upstream's stage 1 and is
# nowhere near converged, so this ranks
# arms and nothing more; its absolute numbers must never be quoted as the paper's.
#
#   python scripts/pretrain.py --config config/Exp1_PD.yaml --list
#
# SELF-CONTAINED: this file holds its own prior. The three experiments do NOT share one,
# because Exp1 sweeps 25 priors, Exp2 runs the single winner, and Exp3 sweeps the mixture.
#
# Prior design: docs/PRIORS.md   Experiment design: docs/EXPERIMENTAL_DESIGN.md
# Every run written up in: docs/RUNS.md
# =============================================================================

experiment: exp1_pd
task: pd

# -----------------------------------------------------------------------------
# ARCHITECTURE — TabICLv2's own, unchanged, and IDENTICAL in all three experiments.
# Loaded from the upstream `tabicl` package, so "same architecture" is a fact rather
# than a claim about a reimplementation. Nothing here is ever swept: the experiments
# are about the PRIOR.
# -----------------------------------------------------------------------------
architecture: tabicl # the upstream TabICL class; see src/models/architecture.py

# -----------------------------------------------------------------------------
# THE SWEEP — every multi-value knob, crossed. This block IS the experiment.
# 4 x 2 x 2 x 2 = 32 combinations, but the three credit knobs are DEAD at credit_fraction 0.0,
# so those 8 collapse to one control: 25 distinct priors x 3 seeds = 75 runs, one SLURM array
# task each. `effective_fingerprint` does the collapsing; see src/utils/config.py.
# Everything below this block is a single value.
# -----------------------------------------------------------------------------
sweep:
  prior.credit_fraction: [0.0, 0.1, 0.2, 0.3] # share of datasets from OUR prior; 0.0 = control
  prior.credit.category_frequency: [balanced, power_law] # even category counts, or a few dominating
  prior.credit.target.signal_strength: [1.0, 0.6] # 1.0 = undiluted; 0.6 is credit's weaker signal
  prior.credit.target.mode: [mechanism, quantile] # Vasicek factor model, or a quantile cut on the latent
  seeds: [0, 1, 2] # repeats, so an effect can be told from noise

# -----------------------------------------------------------------------------
# THE PRIOR — the parts that are NOT swept. Every knob the sweep above sets has been
# removed from here, so there is exactly one place each value comes from. What stays
# is the plumbing that must be identical across arms, or the comparison means nothing.
# -----------------------------------------------------------------------------
prior:
  credit_fraction: 0.2 # SWEPT above; this value is only a fallback
  # SINGLE STAGE, and that is a deliberate scope limit. TabICLv2 trains in THREE, and what
  # changes between them is the row count and the learning rate:
  #     stage 1  500,000 steps (90.9 %)  micro 4  rows 1,024        lr 8e-4   clip 10
  #     stage 2   40,000 steps ( 7.3 %)  micro 1  rows 400-10,240   lr 1e-4   clip 10
  #     stage 3   10,000 steps ( 1.8 %)  micro 1  rows 400-60,000   lr 2e-5   clip  1
  #
  # WHY NOT A PROPORTIONALLY-SHRUNK THREE-STAGE CURRICULUM. Because proportional in STEPS is
  # wildly disproportionate in COMPUTE, and the disproportion lands on the stage that learns
  # least. Rows enter the cost twice: linearly through the column and row encoders, and
  # QUADRATICALLY through the 12-block ICL predictor, which attends across rows. Under a
  # cost(n) = a.n + b.n^2 model calibrated at n=1,024, and with log-uniform row draws, a
  # stage-2 step costs ~7x a stage-1 step and a stage-3 step ~120x. Keep the 90.9/7.3/1.8 split
  # on our 12,500 steps and stage 3 becomes 227 steps -- 1.8 % of the steps and ~61 % of the
  # BUDGET. Total ~3.6x, so ~9 h per arm becomes ~32 h, times 75 arms.
  #
  # And those 227 steps would learn almost nothing: stage 3 runs at lr 2e-5, one FORTIETH of
  # stage 1's. Sum-of-learning-rates is a crude proxy for how far the weights move, and by it
  # stage 3 would contribute ~0.05 % of the run's optimisation while taking 61 % of its cost.
  # Upstream's stages 2-3 are LOW-RATE ADAPTATION to long context, not more prior learning;
  # shrink their step counts 40x and you pay for the adaptation without getting it.
  #
  # WHAT WE DO INSTEAD. Stage 1 only here, and cap the EVALUATION context to 1,024 for both
  # models from one shared setting (`max_context_rows`), so the comparison is matched rather
  # than approximate. Long context belongs in Exp2, on the single winning prior, where 1-3 arms
  # can afford a real stage 2 -- and it needs NO new code: `init.strategy: full` +
  # `pretrained_path` is upstream's `--checkpoint_path ... --only_load_model True`.
  #
  # Also why micro_batch is 4 and not larger: `Trainer.validate_micro_batch` requires every
  # dataset in a micro-batch to share BOTH its sequence length and its train/test split, and
  # both are drawn per GROUP. So micro_batch <= grouping.group_size, full stop. Fixing rows at
  # 1,024 does not relax it, because `train_frac_range` still varies per group.
  # EXACTLY 1,024 ROWS, NEVER FEWER — this is upstream stage 1, not an approximation of it.
  # `train_v2_reg_stage1.sh` passes `--max_seq_len 1024` and NO `--min_seq_len`, and
  # `sample_seq_len` opens with `if min_seq_len is None: return max_seq_len`. So every stage-1
  # dataset is 1,024 rows; only the train/test SPLIT varies (`train_frac_range` below, their
  # 0.3-0.9). Stages 2 and 3 are where the row count becomes a range, log-uniform over
  # [400, 10,240] and [400, 60,000]. Was [512, 1024], which trained on ~25 % fewer rows than
  # the reference and is exactly the kind of unintended difference this project cannot afford.
  n_rows_range: [1024, 1024] # rows per synthetic dataset
  # 1 TO 100, matching `--min_features 1 --max_features 100`. Was [3, 50], which left the top
  # HALF of the feature axis untrained while `max_features: 100` padded the tensors out to 100
  # anyway. Real credit tables are wider still (base_modelisation has 256 columns), so every
  # column past the training range is extrapolation.
  n_features_range: [1, 100] # columns per synthetic dataset
  max_features: 100 # upstream's `--max_features 100`, matched.
  # Was 64. Two reasons to match upstream instead. It is part of what "the same prior, plus
  # credit structure" means — a narrower feature range is a second, unintended difference. And
  # real credit tables are far wider than either (base_modelisation has 256 columns), so every
  # column past the training range is extrapolation; 100 shortens that gap. The column encoder
  # is a SHARED SET TRANSFORMER, so any width is architecturally fine — see docs/PRIORS.md.
  n_nodes_range: [2, 33] # nodes in the random causal graph
  train_frac_range: [0.3, 0.9] # share of rows given as context
  n_classes: 2 # binary: default or not
  max_filter_attempts: 40 # retries before giving up on a rejected dataset

  pool:
    source: generate # generate = build live | pool = read pre-generated shards
    original_variant: original # pool folder for the unmodified TabICL prior
    credit_variant: credit_v1 # pool folder for ours

  grouping:
    group_size: 4 # datasets sharing shape and difficulty; 1 disables grouping
    subgroup_size: 2 # datasets sharing exact values within a group

  base: # the UNMODIFIED TabICL prior — changing this changes the control arm
    max_cat_size: 100 # largest number of categories per column
    category_frequency: balanced # how category counts are distributed

  credit: # OUR credit-targeted path
    max_cat_size: 500 # credit has state, MSA, servicer — high cardinality

    target:
      base_rate_range: [0.01, 0.30] # share of positives; real data is 6.7%-40%
      flip_pos_to_neg: 0.10 # defaults booked as non-default (cures) — the common direction
      flip_neg_to_pos: 0.01 # unobserved defaults — rarer

      mechanism: # only read when mode: mechanism
        rho_range: [0.03, 0.24] # Basel IRB asset correlation: QRRE 0.04, mortgage 0.15, corporate 0.12-0.24
        base_rate_range: [0.02, 0.30] # share of positives under the factor model
        woe_prob: 0.3 # chance of a scorecard-style monotone binning first
        cohort: { min_cohorts: 1, max_cohorts: 12 } # vintage blocks sharing an economic shock

      rules: # hard underwriting cut-offs (Klein & Hoffart 2026 — a position paper, so speculative)
        n_rules: 3 # threshold rules added to the latent
        rule_weight_range: [0.5, 2.5] # how strongly each rule shifts risk
        rule_quantile_range: [0.1, 0.9] # where the cut-offs sit
        conjunction_prob: 0.3 # chance a rule needs two conditions at once

      selection: # you only observe approved applicants
        selection_drop: 0.2 # share of rows removed as rejected
        selection_sharpness: 0.7 # how strictly the cut-off is applied

      missingness:
        missing_col_fraction: 0.3 # share of columns that get missing values
        missing_rate_range: [0.05, 0.35] # how much is missing in those columns
        missing_target_coupling: 1.0 # 1.0 = missingness carries signal (a thin file is a risk signal)
        missing_indicators: true # add a was-missing flag column

    shift: # context and predicted rows come from different populations
      shift_prob: 0.3 # share of datasets given a shift
      kind_weights: { cohort: 1.0, covariate: 1.0, prior_prob: 1.0 } # time | feature range | base rate
      prior_prob_range: [0.15, 0.45] # how far the base rate moves

    noise_features:
      fraction: 0.3 # share of columns carrying no information
      kind_weights: { pure_noise: 1.0, duplicate: 1.0, shuffled: 1.0, constant: 0.5 } # kinds of junk

  filter: # which generated datasets get discarded as unlearnable
    quantile_band: [0.02, 0.30] # pseudo-R^2 band kept when mode: banded; PD is lower-signal than LGD
    remove_trivial: false # also drop datasets that are too easy
    trivial_threshold: 0.1 # what counts as too easy

# -----------------------------------------------------------------------------
# HOW TO START — from scratch, because Exp1 asks about the PRIOR. Warm-starting here
# would confound "this prior is better" with "these weights were already good".
# -----------------------------------------------------------------------------
init:
  strategy: scratch # scratch | full | icl_only | head_only
  pretrained_path: null # checkpoint to start from, for anything but scratch

# -----------------------------------------------------------------------------
# TRAINING — 12,500 steps x 64 datasets = 800,000 datasets per arm, seen ONCE each.
#
# WHY NOT MORE STEPS. Upstream's stage 1 is 500,000 steps = 32,000,000 datasets, so this is
# 2.5 % of it. The limit is credits, not conviction: a B200 GPU-minute costs 437.50 credits
# (VSC charge table) and at the measured 25.6 datasets/s one arm is ~9 h, so 75 arms is
# ~18 M credits BEFORE the row/feature fix above, which roughly doubles the per-step cost.
# Doubling max_steps doubles that. Exp1 buys a RANKING; Exp2 buys the converged number.
#
# THE SCREENING TIER. 75 arms at upstream's full 500,000 steps would be 2.4 BILLION datasets,
# 68x TabICLv2's entire pretraining budget spent on a pilot. At 12,500 it is 60M.
# For reference O'Prior (Bouadi et al. 2026) drew conclusions from 40,000.
# -----------------------------------------------------------------------------
train:
  max_steps: 12500 # gradient updates
  batch_size: 64 # datasets per UPDATE — upstream's `--batch_size 64`, matched.
  # datasets per FORWARD PASS. Gradient accumulation runs batch_size/micro_batch_size passes
  # and averages them, so the update is mathematically identical to one batch of 64 while only
  # micro_batch_size datasets sit in GPU memory at a time. IT DOES NOT CHANGE THE RESULT —
  # only speed and memory — so it is safe to raise on a bigger card. Override per machine with
  # `--micro-batch-size`; a B200 has 183 GiB against the A100's 80 and can take 16.
  #
  # This used to be batch_size: 4 with no accumulation, i.e. an effective batch SIXTEEN TIMES
  # smaller than upstream's while using upstream's learning rate (8e-4, tuned for 64). Large
  # batches tolerate large rates; small ones do not, and that mismatch is the leading suspect
  # for the NaN predictions.
  micro_batch_size: 4

  optimizer: muon # muon = what TabICLv2 uses | adamw
  muon_lr: 8.0e-4 # Muon's rate; it prefers ~8x AdamW's
  lr: 3.0e-4 # AdamW rate, also used for Muon's auxiliary AdamW half
  scheduler: cosine_with_restarts # cosine_with_restarts | constant
  beta1: 0.9 # AdamW momentum
  beta2: 0.95 # AdamW variance decay
  weight_decay: 0.01 # L2 pull toward zero
  gradient_clipping: 10.0 # max gradient norm; TabICLv2 raised this from 1 to 10
  warmup_proportion: 0.01 # share of steps spent ramping the rate up
  cosine_num_cycles: 1 # restarts in the schedule
  cosine_amplitude_decay: 1.0 # how much each cycle shrinks
  cosine_lr_end: 1.0e-7 # floor of the schedule

  amp: true # mixed precision, GPU only
  num_workers: 12 # CPU workers generating datasets
  log_every: 100 # steps between log lines
  save_temp_every: 1000 # steps between rolling checkpoints
  save_perm_every: 12500 # steps between kept-forever checkpoints
  max_temp_checkpoints: 2 # rolling checkpoints retained

# -----------------------------------------------------------------------------
# PROGRESS CURVE — 10 points across the run, so it is visible whether an arm is still
# climbing when the budget ends. Here that matters more than the endpoint.
# -----------------------------------------------------------------------------
progress:
  every_datasets: 5000 # synthetic datasets between measurements; 0 disables
  n_datasets: 4 # real credit datasets scored, smallest first
  n_ood: 8 # out-of-domain datasets scored, if the cache exists
  context_rows: 512 # rows given as context when scoring
  max_test_rows: 2000 # rows scored per dataset

# -----------------------------------------------------------------------------
# LOGGING — every field is explained in docs/RUNS.md, which is also where a finished run
# gets written up. Log generously: a cluster run cannot be watched, so the log is the only
# thing that survives it.
# -----------------------------------------------------------------------------
logging:
  level: INFO # INFO | DEBUG | WARNING
  console: true # also print to stdout
  to_file: null # null = write files on the cluster only
  log_prior_every: 500 # steps between prior-composition reports; 0 disables
  log_prior_samples: 16 # datasets inspected per report
  log_hardware_every: 100 # steps between GPU / memory / throughput samples; 0 disables
  log_grad_every: 250 # steps between per-block gradient-norm reports; 0 disables

# -----------------------------------------------------------------------------
# EVALUATION — the dev/holdout split is frozen BEFORE any prior tuning, and only the final
# report may read holdout. Identical in all three experiments so their numbers are
# comparable; see src/eval/ for the shared harness.
# -----------------------------------------------------------------------------
# dev SPANS the observed base-rate range — 6.7%, 16.0%, 22.1%, 30.0%, 40.0% — and the
# size range, 1k to 150k rows, so an arm chosen on it cannot be tuned to one regime.
eval:
  data_dir: data/raw/pd # where the real datasets live
  dev_datasets: [0001.gmsc, 0004.lendingclub, 0002.taiwan_creditcard, 0008.german, 0005.myhom] # used to choose the prior
  holdout_datasets: [0003.vehicle_loan, 0006.hackerearth, 0007.cobranded, 0009.bank_status,
                     0010.thomas, 0011.loan_default, 0012.home_credit, 0013.hmeq,
                     0014.algorithmwatch] # untouched until the end
  metrics: [auc, ap, brier, logloss, ks, calibration_slope] # all computed in one run
  select_on: dev # dev | holdout — anything but `dev` here invalidates the experiment
  ood_suites: all # which out-of-domain suites to score; see src/eval/ood.py SUITES
