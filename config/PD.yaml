# =============================================================================
# PD EXPERIMENT — Probability of Default. Rare positives, high-cardinality
# categoricals, hard business rules, weak signal. Head: cross-entropy.
#
# HOW TO READ THIS FILE
#   * any setting may be a single value OR a list; a list means "one run per
#     value", and all lists are crossed
#   * `# S:` marks a setting left at one value, showing how to open it up
#   * names ending in `_range` are literal [low, high] intervals, never swept
#
#   python scripts/pretrain.py --config config/PD.yaml --list   # check the count
#
# WHY each setting exists, and what the evidence for it is:
#   -> docs/config_reference.md
# =============================================================================

experiment: pd
task: pd
seeds: [0, 1, 2]

# -----------------------------------------------------------------------------
# PRIOR
# -----------------------------------------------------------------------------
prior:
  # THE MAIN SWITCH — share of pretraining datasets from OUR path.
  # 0.0 = 100% original prior (control) | 0.3 = 70% original
  credit_fraction: [0.0, 0.1, 0.2, 0.3]

  n_rows_range: [512, 1024]
  n_features_range: [3, 50]
  max_features: 64 # headroom for missingness flags and noise columns
  n_nodes_range: [2, 33]
  train_frac_range: [0.3, 0.9]
  n_classes: 2
  max_filter_attempts: 40

  # Where the training datasets come from.
  #   generate = build them live (simple; the GPU waits on CPU generation)
  #   pool     = read pre-generated shards (PREFERRED for the real experiment:
  #              every arm draws its original share from the SAME files, so a
  #              difference between arms cannot be luck of the draw)
  # Build the pools first with scripts/generate_prior.py.
  pool:
    source: generate # S: [generate, pool]
    original_variant: original
    credit_variant: credit_v1

  # TabICL's correlated sampling: datasets in a group share shape and difficulty.
  grouping:
    group_size: 4 # S: [1, 4]   — 1 disables grouping
    subgroup_size: 2

  # The ORIGINAL TabICL prior. Changing these changes the control arm.
  base:
    max_cat_size: 100
    category_frequency: balanced

  # OUR credit-targeted path.
  credit:
    max_cat_size: 500 # S: [100, 500]   — credit has state, MSA, servicer, ...
    category_frequency: [balanced, power_law] # power_law = a few levels dominate

    target:
      base_rate_range: [0.01, 0.30] # positives; real data is 6.7%-40%
      signal_strength: [1.0, 0.6] # 1.0 = undiluted, unrealistically easy
      flip_pos_to_neg: 0.10 # S: [0.0, 0.10]   — cures, the common direction
      flip_neg_to_pos: 0.01 # unobserved defaults, rarer

      # Hard underwriting cut-offs (Klein & Hoffart 2026 — a position paper with
      # no experiments, so the most speculative component here).
      rules:
        n_rules: 3 # S: [0, 3]
        rule_weight_range: [0.5, 2.5]
        rule_quantile_range: [0.1, 0.9]
        conjunction_prob: 0.3

      # You only observe approved applicants (through-the-door / reject inference).
      selection:
        selection_drop: 0.2 # S: [0.0, 0.2]
        selection_sharpness: 0.7

      # A thin file is itself a risk signal, so missingness is target-linked.
      missingness:
        missing_col_fraction: 0.3 # S: [0.0, 0.3]
        missing_rate_range: [0.05, 0.35]
        missing_target_coupling: 1.0
        missing_indicators: true

    # Columns carrying no information. `shuffled` is the interesting kind.
    noise_features:
      fraction: 0.3 # S: [0.0, 0.3, 0.6]
      kind_weights: { pure_noise: 1.0, duplicate: 1.0, shuffled: 1.0, constant: 0.5 }

  # Which generated datasets get discarded.
  # tabicl = as shipped | off = keep all | banded = target credit's signal range
  filter:
    mode: tabicl # S: [tabicl, off, banded]
    quantile_band: [0.02, 0.30] # PD is lower-signal than LGD
    remove_trivial: false
    trivial_threshold: 0.1

# -----------------------------------------------------------------------------
# HOW TO START
# scratch = random init | full = pretrained, train all | icl_only = freeze col+row
# head_only = freeze all blocks.  Details: docs/finetuning.md
# -----------------------------------------------------------------------------
init:
  strategy: scratch # S: [scratch, full, icl_only]
  pretrained_path: null

# -----------------------------------------------------------------------------
# MODEL — identical to LGD.yaml and held FIXED across every run. Do not sweep.
# -----------------------------------------------------------------------------
model:
  embed_dim: 128
  col_num_blocks: 3
  row_num_blocks: 3
  icl_num_blocks: 12
  col_nhead: 8
  row_nhead: 8
  icl_nhead: 8
  feature_group_size: 3
  n_cls_cols: 4
  n_cls_rows: 128

# -----------------------------------------------------------------------------
# TRAINING — 10,000 steps x 4 datasets = 40,000, matching O'Prior's budget.
# -----------------------------------------------------------------------------
train:
  max_steps: 10000
  batch_size: 4
  micro_batch_size: 4
  num_quantiles: 999 # unused for classification; kept so the configs match

  optimizer: adamw
  scheduler: cosine_with_restarts
  lr: 3.0e-4
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  gradient_clipping: 10.0
  warmup_proportion: 0.01
  cosine_num_cycles: 1
  cosine_amplitude_decay: 1.0
  cosine_lr_end: 1.0e-7

  amp: true
  num_workers: 12
  log_every: 50
  save_temp_every: 500
  save_perm_every: 5000
  max_temp_checkpoints: 2

# -----------------------------------------------------------------------------
# LOGGING — files are written on the cluster only, never locally.
# -----------------------------------------------------------------------------
logging:
  level: INFO
  console: true
  to_file: null # null = write files on the cluster only; true/false to force
  log_prior_every: 500
  log_prior_samples: 16

# -----------------------------------------------------------------------------
# EVALUATION — NOT YET WIRED UP. The dev/holdout split must be frozen BEFORE any
# prior tuning; see docs/experimental_design.md §5.6.
# -----------------------------------------------------------------------------
eval:
  data_dir: data/raw/pd
  dev_datasets: [] # TODO decide and freeze
  holdout_datasets: [] # TODO never inspect until the end
  metrics: [roc_auc, pr_auc, brier, ece, log_loss, recall_at_topk]
  # Tanna 2026: context construction matters MORE than model choice on imbalanced
  # credit data, so this must be identical across runs or it confounds the result.
  context_strategy: uniform
  context_size: 5000
